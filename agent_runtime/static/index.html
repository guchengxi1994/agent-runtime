<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Runtime</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <style type="text/tailwindcss">
      @layer base {
        * {
          box-sizing: border-box;
        }
        html,
        body {
          min-height: 100%;
        }
        body {
          @apply m-0 bg-stone-100 font-sans text-zinc-900 antialiased;
          background:
            radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.08), transparent 28%),
            radial-gradient(circle at 100% 0%, rgba(14, 165, 233, 0.08), transparent 24%),
            linear-gradient(180deg, #fafaf9 0%, #f5f5f4 42%, #eef2f7 100%);
        }
        body::before {
          content: "";
          position: fixed;
          inset: 0;
          pointer-events: none;
          background-image:
            linear-gradient(rgba(24, 24, 27, 0.025) 1px, transparent 1px),
            linear-gradient(90deg, rgba(24, 24, 27, 0.025) 1px, transparent 1px);
          background-size: 40px 40px;
          mask-image: linear-gradient(to bottom, black, transparent 88%);
        }
        button,
        textarea,
        input {
          font: inherit;
        }
      }

      @layer components {
        .shell {
          @apply relative mx-auto grid min-h-screen w-full max-w-6xl place-items-center px-3 py-4 sm:px-6 sm:py-6;
        }
        .chat-panel {
          @apply grid w-full overflow-hidden rounded-[28px] border border-zinc-200/80 bg-white/90 backdrop-blur;
          box-shadow: 0 24px 80px rgba(24, 24, 27, 0.08);
          min-height: calc(100vh - 2rem);
          grid-template-rows: auto minmax(0, 1fr) auto;
        }
        .chat-header,
        .composer-actions {
          @apply flex items-center justify-between gap-3;
        }
        .chat-header {
          @apply border-b border-zinc-200/80 px-5 py-4 sm:px-6;
        }
        .chat-header h3 {
          @apply m-0 text-base font-semibold tracking-tight text-zinc-950;
        }
        .eyebrow {
          @apply mb-1 text-[11px] font-semibold uppercase tracking-[0.16em] text-emerald-700;
        }
        .messages {
          @apply min-h-0 overflow-y-auto bg-zinc-50/70 px-4 py-4 sm:px-6;
          display: grid;
          align-content: start;
          gap: 1rem;
        }
        .message {
          @apply grid gap-3;
          grid-template-columns: 2.5rem minmax(0, 1fr);
          animation: rise 180ms ease-out both;
        }
        .message.user {
          grid-template-columns: minmax(0, 1fr) 2.5rem;
        }
        .message.user .avatar {
          @apply col-[2] row-[1] bg-emerald-600 text-white shadow-emerald-900/10;
        }
        .message.user .message-body {
          @apply col-[1] row-[1] justify-self-end;
        }
        .avatar {
          @apply grid h-10 w-10 place-items-center rounded-2xl bg-zinc-900 font-semibold text-white shadow-lg shadow-zinc-900/10;
        }
        .message-body {
          @apply grid max-w-[52rem] gap-2;
        }
        .bubble {
          @apply overflow-hidden rounded-3xl border border-zinc-200 bg-white px-4 py-3 text-[14px] leading-7 text-zinc-800 shadow-sm shadow-zinc-950/[0.02];
        }
        .message.user .bubble {
          @apply border-emerald-200 bg-emerald-50/90 text-zinc-900;
        }
        .markdown-body {
          @apply text-[14px] text-zinc-800;
        }
        .markdown-body > :first-child {
          margin-top: 0;
        }
        .markdown-body > :last-child {
          margin-bottom: 0;
        }
        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4,
        .markdown-body h5,
        .markdown-body h6 {
          @apply my-4 font-semibold tracking-tight text-zinc-950;
          line-height: 1.3;
        }
        .markdown-body h1 { @apply text-2xl; }
        .markdown-body h2 { @apply text-xl; }
        .markdown-body h3 { @apply text-lg; }
        .markdown-body h4,
        .markdown-body h5,
        .markdown-body h6 { @apply text-base; }
        .markdown-body p,
        .markdown-body ul,
        .markdown-body ol,
        .markdown-body blockquote,
        .markdown-body .code-block,
        .markdown-body .table-wrap {
          @apply my-3;
        }
        .markdown-body ul,
        .markdown-body ol { @apply pl-6; }
        .markdown-body li + li { @apply mt-1; }
        .markdown-body blockquote { @apply border-l-4 border-zinc-300 pl-4 text-zinc-600; }
        .markdown-body hr { @apply my-4 border-0 border-t border-zinc-200; }
        .markdown-body a { @apply font-medium text-cyan-700 underline decoration-cyan-200 underline-offset-4; }
        .markdown-body strong { @apply font-semibold text-zinc-950; }
        .markdown-body code { @apply rounded-lg border border-zinc-200 bg-zinc-100 px-1.5 py-0.5 font-mono text-[0.92em] text-zinc-900; }
        .markdown-body .code-block { @apply overflow-hidden rounded-2xl border border-zinc-200 bg-zinc-950 text-zinc-100; }
        .markdown-body .code-block-label { @apply border-b border-zinc-800 bg-zinc-900/90 px-3 py-2 text-[11px] font-semibold uppercase tracking-[0.12em] text-zinc-400; }
        .markdown-body .code-block pre { @apply m-0 overflow-auto px-4 py-3; }
        .markdown-body .code-block pre code { @apply border-0 bg-transparent p-0 text-zinc-100; white-space: pre; }
        .markdown-body .table-wrap { @apply overflow-auto rounded-2xl border border-zinc-200 bg-white; }
        .markdown-body table { @apply w-full min-w-[26rem] border-collapse text-sm; }
        .markdown-body th,
        .markdown-body td { @apply border-b border-zinc-200 px-3 py-2 align-top; }
        .markdown-body th { @apply bg-zinc-50 font-semibold text-zinc-900; }
        .markdown-body tr:last-child td { @apply border-b-0; }
        .markdown-body .align-left { text-align: left; }
        .markdown-body .align-center { text-align: center; }
        .markdown-body .align-right { text-align: right; }
        .live-stream { @apply grid gap-2 rounded-2xl border border-cyan-200/70 bg-cyan-50/70 p-3; }
        .live-stream-title { @apply text-[11px] font-semibold uppercase tracking-[0.14em] text-cyan-800; }
        .live-block { @apply rounded-2xl border border-zinc-200 bg-white px-3 py-2; }
        .live-block strong { @apply block text-[13px] font-semibold text-zinc-900; }
        .live-block p { @apply mt-1 whitespace-pre-wrap text-[13px] leading-6 text-zinc-600; }
        .live-block pre { @apply mt-2 max-h-40 overflow-auto rounded-xl bg-zinc-950 px-3 py-2 text-[12px] text-zinc-100; white-space: pre-wrap; }
        .live-block.tool { @apply border-emerald-200; }
        .live-block.tool strong { @apply text-emerald-800; }
        .live-block.muted { @apply opacity-75; }
        .requested-inputs { @apply grid gap-2 rounded-2xl border border-amber-200 bg-amber-50/80 p-3; }
        .requested-inputs-title { @apply text-[11px] font-semibold uppercase tracking-[0.14em] text-amber-800; }
        .requested-field { @apply rounded-2xl border border-amber-200/80 bg-white px-3 py-3; }
        .requested-field-head { @apply flex items-center justify-between gap-3; }
        .requested-field-head strong { @apply text-sm font-semibold text-zinc-950; }
        .requested-field-head span { @apply rounded-full bg-amber-500 px-2.5 py-1 text-[11px] font-semibold text-white; }
        .requested-field p { @apply mt-2 text-[13px] leading-6 text-zinc-700; }
        .requested-field small { @apply mt-2 block text-[12px] text-zinc-500; }
        .tool-results { @apply grid gap-3; }
        .tool-result-group { @apply grid gap-3; }
        .tool-result-heading { @apply text-[11px] font-semibold uppercase tracking-[0.14em] text-zinc-500; }
        .tool-card { @apply overflow-hidden rounded-2xl border border-zinc-200 bg-white shadow-sm shadow-zinc-950/[0.03]; }
        .tool-card-head { @apply flex flex-wrap items-start justify-between gap-3 border-b border-zinc-200 bg-zinc-50 px-4 py-3; }
        .tool-card-head strong { @apply text-sm font-semibold text-zinc-950; }
        .tool-card-head span { @apply text-xs text-zinc-500; }
        .tool-card-body { @apply grid gap-3 px-4 py-4; }
        .tool-card-summary { @apply text-[13px] leading-6 text-zinc-700; }
        .chart-canvas { @apply h-[320px] w-full rounded-2xl bg-white; }
        .chart-meta { @apply text-xs text-zinc-500; }
        .tool-result-table-wrap { @apply overflow-auto rounded-2xl border border-zinc-200; }
        .tool-result-table { @apply w-full min-w-[32rem] border-collapse text-sm; }
        .tool-result-table th,
        .tool-result-table td { @apply border-b border-zinc-200 px-3 py-2 text-left align-top; }
        .tool-result-table th { @apply bg-zinc-50 font-semibold text-zinc-900; }
        .tool-result-table tr:last-child td { @apply border-b-0; }
        .tool-result-badge { @apply inline-flex items-center rounded-full bg-cyan-100 px-2.5 py-1 text-[11px] font-semibold text-cyan-800; }
        .composer { @apply border-t border-zinc-200/80 bg-white px-5 py-4 sm:px-6; display: grid; gap: 0.75rem; }
        .upload-row { @apply flex flex-wrap items-center gap-3 rounded-2xl border border-dashed border-zinc-300 bg-zinc-50 px-3 py-3; }
        .upload-field { @apply grid min-w-[12rem] gap-0.5; }
        .upload-field span { @apply text-sm font-semibold text-zinc-900; }
        .upload-field small { @apply text-xs text-zinc-500; }
        #fileInput { @apply block w-full max-w-full text-sm text-zinc-600; }
        #fileInput::file-selector-button { @apply mr-3 rounded-xl border-0 bg-zinc-900 px-3 py-2 text-sm font-semibold text-white transition hover:bg-zinc-800; }
        .workspace-input { @apply block w-full rounded-2xl border border-zinc-300 bg-white px-3 py-2 text-sm text-zinc-900 outline-none transition placeholder:text-zinc-400 focus:border-cyan-500 focus:ring-4 focus:ring-cyan-500/10; }
        .selected-files { @apply flex flex-wrap gap-2; }
        .selected-file { @apply rounded-full border border-zinc-200 bg-zinc-100 px-3 py-1.5 text-xs font-medium text-zinc-700; }
        .uploaded-files { @apply grid gap-2 rounded-2xl border border-zinc-200 bg-zinc-50/80 p-3; }
        .uploaded-files-title { @apply text-[11px] font-semibold uppercase tracking-[0.12em] text-zinc-600; }
        .uploaded-file { @apply flex items-center justify-between gap-3 rounded-2xl border border-zinc-200 bg-white px-3 py-2; }
        .uploaded-file strong { @apply min-w-0 truncate text-[13px] font-medium text-zinc-900; }
        .uploaded-file small { @apply shrink-0 text-xs text-zinc-500; }
        textarea { @apply block min-h-[8.5rem] w-full resize-y rounded-3xl border border-zinc-300 bg-zinc-50 px-4 py-3 text-[14px] leading-7 text-zinc-900 outline-none transition placeholder:text-zinc-400 focus:border-cyan-500 focus:bg-white focus:ring-4 focus:ring-cyan-500/10; }
        .conversation-id { @apply text-xs text-zinc-500; }
        .primary,
        .ghost { @apply inline-flex items-center justify-center rounded-2xl font-semibold transition; }
        .primary { @apply bg-zinc-900 px-4 py-3 text-white shadow-lg shadow-zinc-900/10 hover:bg-zinc-800; }
        .primary:disabled { @apply cursor-wait opacity-60; }
        .ghost { @apply border border-zinc-200 bg-white px-3 py-2 text-zinc-700 hover:bg-zinc-50; }
        .run-log { @apply overflow-hidden rounded-2xl border border-zinc-200 bg-white; }
        .run-log summary { @apply flex cursor-pointer list-none items-center justify-between gap-3 bg-zinc-50 px-3 py-3; }
        .run-log summary::-webkit-details-marker { display: none; }
        .run-log summary span { @apply text-[11px] font-semibold uppercase tracking-[0.12em] text-zinc-500; }
        .run-log summary strong { @apply text-[13px] font-medium text-zinc-800; }
        .run-log.used-tool { @apply border-emerald-200; }
        .run-log.used-tool summary { @apply bg-emerald-50; }
        .run-log.no-tool summary { @apply bg-zinc-50; }
        .run-log.waiting { @apply border-amber-200; }
        .run-log.waiting summary { @apply bg-amber-50; }
        .run-log-body { @apply grid gap-2 px-3 py-3; }
        .run-step { @apply rounded-2xl border border-zinc-200 bg-zinc-50 px-3 py-3; }
        .run-step-line { @apply flex flex-wrap items-center gap-2; }
        .run-step-line strong { @apply text-[13px] font-semibold text-zinc-900; }
        .run-step-line small { @apply text-xs text-zinc-500; }
        .step-kind { @apply rounded-full bg-zinc-900 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-[0.08em] text-white; }
        .step-thinking .step-kind { @apply bg-amber-500 text-white; }
        .step-sandbox_execution .step-kind { @apply bg-emerald-600; }
        .step-waiting_for_user .step-kind { @apply bg-amber-600; }
        .run-step p { @apply mt-2 text-[13px] leading-6 text-zinc-600; }
        .run-step pre { @apply mt-3 max-h-60 overflow-auto rounded-xl bg-zinc-950 px-3 py-3 text-[12px] text-zinc-100; }
      }

      @layer utilities {
        .messages::-webkit-scrollbar,
        .markdown-body .table-wrap::-webkit-scrollbar,
        .markdown-body .code-block pre::-webkit-scrollbar,
        .run-step pre::-webkit-scrollbar,
        .live-block pre::-webkit-scrollbar,
        .tool-result-table-wrap::-webkit-scrollbar {
          width: 10px;
          height: 10px;
        }
        .messages::-webkit-scrollbar-thumb,
        .markdown-body .table-wrap::-webkit-scrollbar-thumb,
        .markdown-body .code-block pre::-webkit-scrollbar-thumb,
        .run-step pre::-webkit-scrollbar-thumb,
        .live-block pre::-webkit-scrollbar-thumb,
        .tool-result-table-wrap::-webkit-scrollbar-thumb {
          background: rgba(113, 113, 122, 0.25);
          border-radius: 999px;
        }
        .messages::-webkit-scrollbar-track,
        .markdown-body .table-wrap::-webkit-scrollbar-track,
        .markdown-body .code-block pre::-webkit-scrollbar-track,
        .run-step pre::-webkit-scrollbar-track,
        .live-block pre::-webkit-scrollbar-track,
        .tool-result-table-wrap::-webkit-scrollbar-track {
          background: transparent;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 720px) {
        .chat-panel {
          min-height: calc(100vh - 1rem);
        }
        .chat-header,
        .composer-actions {
          @apply items-stretch;
          flex-direction: column;
        }
        .message {
          grid-template-columns: 2rem minmax(0, 1fr);
        }
        .message.user {
          grid-template-columns: minmax(0, 1fr) 2rem;
        }
        .avatar {
          @apply h-8 w-8 rounded-xl text-xs;
        }
        .message-body {
          @apply max-w-full;
        }
        .primary {
          @apply w-full;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="chat-panel" aria-label="Agent Runtime chat">
        <header class="chat-header">
          <div>
            <p class="eyebrow">Agent Runtime</p>
            <h3>对话入口</h3>
          </div>
          <button class="ghost" id="resetConversation" type="button">新会话</button>
        </header>

        <div class="messages" id="messages">
          <div class="message assistant">
            <div class="avatar">AR</div>
            <div class="message-body">
              <div class="bubble markdown-body">
                输入任务。模型会自行选择 harness 或 executable skill；如果执行了 sandbox 工具，运行日志会附在回复下面。
              </div>
            </div>
          </div>
        </div>

        <form class="composer" id="chatForm">
          <div class="upload-row">
            <label class="upload-field" for="fileInput">
              <span>上传文件</span>
              <small>支持 txt、md、代码、csv、xlsx、xls、docx、pdf</small>
            </label>
            <input
              id="fileInput"
              name="files"
              type="file"
              multiple
              accept=".txt,.md,.markdown,.py,.js,.ts,.tsx,.jsx,.json,.yaml,.yml,.xml,.html,.css,.scss,.sql,.log,.ini,.cfg,.conf,.toml,.java,.c,.cpp,.h,.hpp,.go,.rs,.sh,.bash,.zsh,.ps1,.csv,.xlsx,.xls,.xlsm,.docx,.pdf"
            />
            <label class="upload-field" for="workspaceInput">
              <span>Workspace</span>
              <small>不填则由服务端自动生成，可跨会话复用</small>
            </label>
            <input class="workspace-input" id="workspaceInput" type="text" placeholder="例如：plant_a_line_3" />
          </div>
          <div class="selected-files" id="selectedFiles"></div>
          <textarea
            id="messageInput"
            rows="4"
            placeholder="输入需求，例如：计算 (123 + 456) / 3，或让 agent 执行一个复杂业务流程..."
          ></textarea>
          <div class="composer-actions">
            <div class="conversation-id" id="sessionMeta">conversation: new · workspace: auto</div>
            <button class="primary" id="sendButton" type="submit">发送</button>
          </div>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="/static/app.js?v=20260708-query-charts"></script>
  </body>
</html>
