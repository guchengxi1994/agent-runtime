<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Runtime</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260704-runlog" />
  </head>
  <body>
    <main class="shell">
      <section class="chat-panel" aria-label="Agent Runtime chat">
        <header class="chat-header">
          <div>
            <p class="eyebrow">Agent Runtime</p>
            <h3>对话入口</h3>
          </div>
          <button class="ghost" id="resetConversation" type="button">新会话</button>
        </header>

        <div class="messages" id="messages">
          <div class="message assistant">
            <div class="avatar">AR</div>
            <div class="message-body">
              <div class="bubble">
                输入任务。模型会自行选择 harness 或 executable skill；如果执行了 sandbox 工具，运行日志会附在回复下面。
              </div>
            </div>
          </div>
        </div>

        <form class="composer" id="chatForm">
          <textarea
            id="messageInput"
            rows="4"
            placeholder="输入需求，例如：计算 (123 + 456) / 3，或让 agent 执行一个复杂业务流程..."
          ></textarea>
          <div class="composer-actions">
            <div class="conversation-id" id="conversationId">conversation: new</div>
            <button class="primary" id="sendButton" type="submit">发送</button>
          </div>
        </form>
      </section>
    </main>

    <script src="/static/app.js?v=20260704-runlog"></script>
  </body>
</html>
