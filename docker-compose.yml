services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_runtime}
      POSTGRES_USER: ${POSTGRES_USER:-agent_runtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_runtime}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_runtime} -d ${POSTGRES_DB:-agent_runtime}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  agent-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      AGENT_RUNTIME_SANDBOX_URL: http://sandbox:8001
      AGENT_RUNTIME_MCP_GATEWAY_URL: http://mcp-gateway:8002
      AGENT_RUNTIME_REGISTRY_DIR: /app/registry
      AGENT_RUNTIME_ARTIFACTS_DIR: /app/artifacts
    ports:
      - "8010:8010"
    volumes:
      - ./agent_runtime:/app/agent_runtime
      - ./registry:/app/registry
      - ./artifacts:/app/artifacts
    depends_on:
      - sandbox
      - mcp-gateway

  mcp-gateway:
    build:
      context: .
      dockerfile: mcp_gateway/Dockerfile
    env_file:
      - .env
    environment:
      MCP_GATEWAY_PORT: "8002"
    volumes:
      - ./mcp_gateway:/app/mcp_gateway
      - ./mcp_server:/app/mcp_server
    expose:
      - "8002"

  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    env_file:
      - .env
    environment:
      ARTISAN_PLUGIN_SERVER_PORT: "8001"
      ARTISAN_PLUGIN_RUNTIME_DIR: /app/plugins_runtime
      AGENT_RUNTIME_ARTIFACTS_DIR: /app/artifacts
      ARTISAN_PLUGIN_MAX_BODY_BYTES: "4194304"
    ports:
      - "8001:8001" # expose port when developing
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sandbox-runtime:
  postgres-data:
