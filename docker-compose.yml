services:
  agent-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AGENT_RUNTIME_MODEL: ${AGENT_RUNTIME_MODEL:-gpt-4.1-mini}
      AGENT_RUNTIME_SANDBOX_URL: http://sandbox:8001
      AGENT_RUNTIME_REGISTRY_DIR: /app/registry
    ports:
      - "8010:8010"
    volumes:
      - ./registry:/app/registry
    depends_on:
      - sandbox

  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    environment:
      ARTISAN_PLUGIN_SERVER_PORT: "8001"
      ARTISAN_PLUGIN_RUNTIME_DIR: /app/plugins_runtime
    expose:
      - "8001"
    volumes:
      - sandbox-runtime:/app/plugins_runtime

volumes:
  sandbox-runtime:
