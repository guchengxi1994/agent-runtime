services:
  agent-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      AGENT_RUNTIME_SANDBOX_URL: http://sandbox:8001
      AGENT_RUNTIME_REGISTRY_DIR: /app/registry
      AGENT_RUNTIME_ARTIFACTS_DIR: /app/artifacts
    ports:
      - "8010:8010"
    volumes:
      - ./agent_runtime:/app/agent_runtime
      - ./registry:/app/registry
      - ./artifacts:/app/artifacts
    depends_on:
      - sandbox

  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    env_file:
      - .env
    environment:
      ARTISAN_PLUGIN_SERVER_PORT: "8001"
      ARTISAN_PLUGIN_RUNTIME_DIR: /app/plugins_runtime
      AGENT_RUNTIME_ARTIFACTS_DIR: /app/artifacts
    ports:
      - "8001:8001" # expose port when developing
    volumes:
      - ./artifacts:/app/artifacts
      - sandbox-runtime:/app/plugins_runtime

volumes:
  sandbox-runtime:
